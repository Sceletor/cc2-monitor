[package]
name = "cc2-monitor"
version = "1.0.1-beta.1"
edition = "2021"
description = "Native desktop monitor for the Elegoo Centauri Carbon 2"
license = "MIT"
repository = "https://github.com/AlvaroEPena/cc2-monitor"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
egui_plot = "0.31"
rumqttc = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
jpeg-decoder = { version = "0.3", default-features = false }
ureq = { version = "2.12", default-features = false }
md5 = "0.7"
rfd = "0.15"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Decoding camera frames in debug builds is painfully slow without this.
[profile.dev.package."*"]
opt-level = 2

# Embeds assets/icon.ico and version info into the Windows .exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
